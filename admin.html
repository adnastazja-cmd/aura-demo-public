:root{--ease:cubic-bezier(.22,.7,.25,1);--line:rgba(255,255,255,.2);--glass:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Evolventa',Verdana,sans-serif;color:#fff;min-height:100vh;
  background:radial-gradient(ellipse at 50% -10%,#1d1a4d 0%,#0a0820 45%,#05030f 100%)}

header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:16px 18px;background:rgba(10,8,32,.82);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
header img{height:24px}
header .right{display:flex;align-items:center;gap:10px;font-size:.72rem;color:rgba(255,255,255,.6)}
.ghost{background:none;border:1px solid var(--line);color:#fff;font-family:inherit;font-size:.72rem;
  padding:7px 13px;border-radius:999px;cursor:pointer}

.wrap{max-width:720px;margin:0 auto;padding:18px}

/* login */
#login{max-width:400px;margin:16vh auto;padding:26px 22px;border-radius:24px;
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
#login h1{font-size:1.25rem;margin-bottom:6px}
#login p{font-size:.82rem;color:rgba(255,255,255,.62);line-height:1.5;margin-bottom:18px}

input,textarea,select{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--line);
  border-radius:14px;color:#fff;font-family:inherit;font-size:.92rem;padding:12px 14px;outline:none;resize:vertical}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.4)}
input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.6}
label{display:block;font-size:.68rem;letter-spacing:.07em;color:rgba(255,255,255,.5);margin:14px 0 6px}
.btn{width:100%;padding:13px;border-radius:999px;border:none;cursor:pointer;font-family:inherit;
  font-weight:700;font-size:.88rem;background:#fff;color:#141a52;margin-top:18px}
.btn[disabled]{opacity:.4}
.btn.sec{background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--line)}
.btn.warn{background:rgba(255,120,120,.16);color:#ffb3b3;border:1px solid rgba(255,120,120,.35)}

/* cards */
.req{border-radius:22px;padding:18px;margin-bottom:14px;background:var(--glass);
  border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.req .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.badge{font-size:.62rem;letter-spacing:.1em;padding:5px 11px;border-radius:999px;white-space:nowrap}
.b-pending{background:rgba(255,207,143,.18);color:#ffcf8f;border:1px solid rgba(255,207,143,.4)}
.b-confirmed{background:rgba(160,180,255,.18);color:#b9c6ff;border:1px solid rgba(160,180,255,.4)}
.b-delivered{background:rgba(138,255,192,.15);color:#8affc0;border:1px solid rgba(138,255,192,.36)}
.b-declined{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);border:1px solid var(--line)}
.when{font-size:.66rem;color:rgba(255,255,255,.45)}
.q{font-size:.98rem;line-height:1.5;margin-bottom:10px}
.meta{font-size:.74rem;line-height:1.7;color:rgba(255,255,255,.6)}
.meta b{color:rgba(255,255,255,.85);font-weight:400}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions button{flex:1;min-width:120px;margin-top:0;padding:11px}
.panel{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:none}
.panel.on{display:block}
.thumb{width:100%;border-radius:14px;margin-top:10px;display:block}
.hint{font-size:.7rem;color:rgba(255,255,255,.45);margin-top:6px;line-height:1.5}
.empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.45);font-size:.88rem;line-height:1.6}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:40;padding:11px 20px;
  border-radius:999px;font-size:.8rem;background:rgba(255,255,255,.12);border:1px solid var(--line);
  backdrop-filter:blur(20px);opacity:0;transition:.4s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="login">
  <h1>Заявки на расклад</h1>
  <p>Введи ключ — тот, что записан в ADMIN_KEY на Render. Он сохранится в этом браузере, повторно вводить не придётся.</p>
  <input type="password" id="key" placeholder="Ключ" autocomplete="current-password">
  <button class="btn" id="enter">Войти</button>
  <p class="hint" id="loginErr" style="color:#ffb3b3"></p>
</div>

  <div class="wrap" id="list"></div>

<div class="toast" id="toast"></div>

<script>
var API_URL = 'https://aura-demo-1.onrender.com';

var KEY = null;
var listEl = document.getElementById('list');

function toast(text){
  var el=document.getElementById('toast');
  el.textContent=text; el.classList.add('on');
  setTimeout(function(){ el.classList.remove('on'); }, 2600);
}

function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json','X-Admin-Key':KEY}, opts.headers||{});
  return fetch(API_URL.replace(/\/$/,'') + path, opts).then(function(r){
    if(r.status===403) throw 'forbidden';
    if(!r.ok) throw 'error';
    return r.json();
  });
}

/* ---------- login ---------- */
function tryKey(k){
  KEY = k;
  return api('/admin/tarot').then(function(d){
    localStorage.setItem('oura_admin_key', k);
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='';
    render(d.requests);
    startAuto();
    return true;
  });
}
document.getElementById('enter').addEventListener('click', function(){
  var k=document.getElementById('key').value.trim();
  if(!k) return;
  document.getElementById('loginErr').textContent='Проверяю…';
  tryKey(k).catch(function(e){
    document.getElementById('loginErr').textContent =
      (e==='forbidden') ? 'Ключ не подошёл.' : 'Сервис не отвечает. Если он спал, подожди минуту и попробуй снова.';
  });
});
document.getElementById('key').addEventListener('keydown',function(e){
  if(e.key==='Enter') document.getElementById('enter').click();
});
document.getElementById('logout').addEventListener('click',function(){
  localStorage.removeItem('oura_admin_key'); location.reload();
});
document.getElementById('refresh').addEventListener('click', reload);

/* ---------- rendering ---------- */
var LABEL = {pending:'ЖДЁТ ОТВЕТА', confirmed:'ПОДТВЕРЖДЕНО',
             delivered:'ОТПРАВЛЕНО', declined:'ОТКЛОНЕНО'};

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmt(iso){
  if(!iso) return '';
  var d=new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function render(rows){
  document.getElementById('count').textContent =
    rows.filter(function(r){return r.status==='pending'}).length + ' новых';
  if(!rows.length){
    listEl.innerHTML='<div class="empty">Заявок пока нет.<br>Страница сама обновляется каждые 20 секунд.</div>';
    return;
  }
  /* assemble first, swap in second: a failure halfway must not leave a blank screen */
  var frag=document.createDocumentFragment();
  rows.forEach(function(r){ frag.appendChild(card(r)); });
  listEl.innerHTML='';
  listEl.appendChild(frag);
}

function card(r){
  var el=document.createElement('div');
  el.className='req';
  var meta='';
  if(r.preferred_at) meta+='Просит: <b>'+esc(fmt(r.preferred_at))+'</b><br>';
  if(r.scheduled_at) meta+='Назначено: <b>'+esc(r.scheduled_at)+'</b><br>';
  if(r.contact)      meta+='Контакт: <b>'+esc(r.contact)+'</b><br>';
  if(r.cards)        meta+='Карты: <b>'+esc(r.cards)+'</b><br>';
  if(r.note)         meta+='Заметка: <b>'+esc(r.note)+'</b><br>';

  el.innerHTML =
    '<div class="top"><span class="badge b-'+r.status+'">'+LABEL[r.status]+'</span>'+
    '<span class="when">'+fmt(r.created_at)+'</span></div>'+
    '<div class="q">'+esc(r.question)+'</div>'+
    '<div class="meta">'+meta+'</div>';

  if(r.status==='delivered'){
    if(r.photo_url){ var i=document.createElement('img'); i.className='thumb'; i.src=r.photo_url; el.appendChild(i); }
    return el;
  }
  if(r.status==='declined') return el;

  /* --- actions --- */
  var acts=document.createElement('div');
  acts.className='actions';
  el.appendChild(acts);

  var confirmPanel=panelConfirm(r, el);
  var deliverPanel=panelDeliver(r, el);
  var declinePanel=panelDecline(r, el);
  el.appendChild(confirmPanel); el.appendChild(deliverPanel); el.appendChild(declinePanel);

  function only(p){
    [confirmPanel,deliverPanel,declinePanel].forEach(function(x){
      x.classList.toggle('on', x===p && !x.classList.contains('on'));
    });
  }

  if(r.status==='pending'){
    acts.appendChild(mk('Подтвердить время','btn', function(){ only(confirmPanel); }));
  }
  acts.appendChild(mk('Отправить расклад','btn sec', function(){ only(deliverPanel); }));
  acts.appendChild(mk('Отказать','btn warn', function(){ only(declinePanel); }));
  return el;
}

function mk(text, cls, fn){
  var b=document.createElement('button'); b.className=cls; b.textContent=text;
  b.addEventListener('click',fn); return b;
}

function panelConfirm(r){
  var p=document.createElement('div'); p.className='panel';
  p.innerHTML='<label>КОГДА ПРОВЕДЁШЬ</label><input type="datetime-local" class="dt">'+
              '<label>ЗАПИСКА ЧЕЛОВЕКУ (необязательно)</label><input type="text" class="nt" placeholder="Например: буду на связи в 20:30">';
  var go=mk('Подтвердить','btn',function(){
    var dt=p.querySelector('.dt').value;
    if(!dt){ toast('Укажи время'); return; }
    go.disabled=true;
    api('/admin/tarot/'+r.id+'/confirm',{method:'POST',
      body:JSON.stringify({scheduled_at:humanTime(dt), note:p.querySelector('.nt').value.trim()||null})})
      .then(function(){ toast('Время подтверждено'); reload(); })
      .catch(function(){ go.disabled=false; toast('Не получилось. Попробуй ещё раз'); });
  });
  p.appendChild(go);
  return p;
}

function humanTime(v){
  var d=new Date(v);
  if(isNaN(d)) return v;
  return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function panelDeliver(r){
  var p=document.createElement('div'); p.className='panel';
  p.innerHTML='<label>КАРТЫ (необязательно)</label><input type="text" class="cd" placeholder="Звезда · Башня · Двойка кубков">'+
              '<label>ОТВЕТ НА ВОПРОС</label><textarea class="an" rows="6" placeholder="Что говорит расклад"></textarea>'+
              '<label>ФОТО РАСКЛАДА</label><input type="file" class="ph" accept="image/*">'+
              '<div class="hint">Фото сожмётся прямо здесь, грузить ничего никуда не нужно.</div>';
  var preview=document.createElement('img'); preview.className='thumb'; preview.style.display='none';
  p.appendChild(preview);

  var photoData=null;
  p.querySelector('.ph').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return;
    shrink(f, function(dataUrl){
      photoData=dataUrl; preview.src=dataUrl; preview.style.display='block';
    });
  });

  var go=mk('Отправить человеку','btn',function(){
    var an=p.querySelector('.an').value.trim();
    if(!an){ toast('Напиши ответ'); return; }
    go.disabled=true;
    api('/admin/tarot/'+r.id+'/deliver',{method:'POST',
      body:JSON.stringify({answer:an, cards:p.querySelector('.cd').value.trim()||null, photo_url:photoData})})
      .then(function(){ toast('Отправлено'); reload(); })
      .catch(function(){ go.disabled=false; toast('Не получилось. Попробуй ещё раз'); });
  });
  p.appendChild(go);
  return p;
}

function panelDecline(r){
  var p=document.createElement('div'); p.className='panel';
  p.innerHTML='<label>ЧТО НАПИСАТЬ ЧЕЛОВЕКУ</label><input type="text" class="nt" placeholder="Это время не подходит, могу в четверг вечером">';
  var go=mk('Отправить отказ','btn warn',function(){
    go.disabled=true;
    api('/admin/tarot/'+r.id+'/decline',{method:'POST',
      body:JSON.stringify({note:p.querySelector('.nt').value.trim()||null})})
      .then(function(){ toast('Отправлено'); reload(); })
      .catch(function(){ go.disabled=false; toast('Не получилось'); });
  });
  p.appendChild(go);
  return p;
}

/* shrink a phone photo to something sane before it travels */
function shrink(file, done){
  var img=new Image();
  img.onload=function(){
    var max=1400, s=Math.min(1, max/Math.max(img.width,img.height));
    var c=document.createElement('canvas');
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    done(c.toDataURL('image/jpeg',0.82));
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(file);
}

/* ---------- refresh ---------- */
var autoTimer=null;
function reload(){
  return api('/admin/tarot')
    .then(function(d){ render(d.requests); })
    .catch(function(e){
      /* the list on screen stays as it was; say so instead of going quiet */
      toast(e==='forbidden' ? 'Ключ перестал подходить' : 'Не удалось обновить список');
    });
}
function startAuto(){
  clearInterval(autoTimer);
  autoTimer=setInterval(function(){
    if(!document.querySelector('.panel.on')) reload();   // don't wipe a form mid-typing
  }, 20000);
}

var saved=localStorage.getItem('oura_admin_key');
if(saved) tryKey(saved).catch(function(){ localStorage.removeItem('oura_admin_key'); });
